name: Build Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libsdl1.2-dev

      - name: Build
        run: make

      - name: Verify executable
        run: test -x bin/Cybersphere-SDL

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: Cybersphere-SDL-linux
          path: bin/Cybersphere-SDL
          if-no-files-found: error
